global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "course-platform-monitor"

scrape_configs:
  - job_name: "course-platform-gateway"
    static_configs:
      - targets: ["gateway:3000"]
        labels:
          service: "gateway"
          environment: "development"
    metrics_path: "/metrics"
    scrape_interval: 5s

  - job_name: "course-platform-monolith"
    static_configs:
      - targets: ["monolith:3000"]
        labels:
          service: "monolith"
          environment: "development"
    metrics_path: "/metrics"
    scrape_interval: 5s

  - job_name: "course-platform-users"
    static_configs:
      - targets: ["users:3000"]
        labels:
          service: "users"
          environment: "development"
    metrics_path: "/metrics"
    scrape_interval: 5s

  - job_name: "course-platform-accounts"
    static_configs:
      - targets: ["accounts:3000"]
        labels:
          service: "accounts"
          environment: "development"
    metrics_path: "/metrics"
    scrape_interval: 5s

  - job_name: "course-platform-courses"
    static_configs:
      - targets: ["courses:3000"]
        labels:
          service: "courses"
          environment: "development"
    metrics_path: "/metrics"
    scrape_interval: 5s

