global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'course-platform-monitor'

scrape_configs:
  - job_name: 'course-platform-monolith'
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'monolith'
          environment: 'development'
    metrics_path: '/metrics'
    scrape_interval: 10s
