version: '3.8'
services:
  # --- Le service monolithique
  gateway:
    build: gateway
    ports:
      - "3000:3000"
    # 🤓 Volumes pour activer le hot-reload (ignorer)
    volumes:
      - ./gateway/src:/app/src:ro
      - ./gateway/tsconfig.json:/app/tsconfig.json:ro
      # 📣 Exclut node_modules pour éviter les conflits
      - /app/node_modules
    environment:
      - PORT=3000
      - NODE_ENV=development
      - JWT_SECRET=workshop_fake_secret_key
      - MONOLITH_URL=http://monolith:3000
      - USERS_URL=http://users:3000
      - ACCOUNTS_URL=http://accounts:3000
    depends_on:
      monolith:
        condition: service_healthy
      users:
        condition: service_healthy
      accounts:
        condition: service_healthy
    # 📣 Le health check est un endpoint qui sera utilisé pour vérifier que le service est en bonne santé.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/gateway/health"]
      interval: 3s
      timeout: 1s
      retries: 3
      start_period: 1s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
  # --- Template service (copy and customize)
