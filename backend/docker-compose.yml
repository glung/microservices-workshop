  #     - PORT=3000
  #     - NODE_ENV=development
  #   depends_on:
  #     template-db:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
  #     interval: 3s
  #     timeout: 1s
  #     retries: 3
  #     start_period: 1s
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '1.0'
  #         memory: 512M
  #       reservations:
  #         cpus: '0.5'
  #         memory: 256M
  # template-db:
  #   image: postgres:15-alpine
  #   environment:
  #     - POSTGRES_USER=courseuser
  #     - POSTGRES_PASSWORD=coursepass
  #     - POSTGRES_DB=templatedb
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - template_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U courseuser -d templatedb"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '1.0'
  #         memory: 512M
  #       reservations:
  #         cpus: '0.25'
  #         memory: 128M
  # --- Le service monolith et sa base de données
  users:
    build: services/users
    expose:
      - "3000"
    volumes:
      - ./services/users/src:/app/src:ro
      - ./services/users/tsconfig.json:/app/tsconfig.json:ro
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://courseuser:coursepass@monolith-db:5432/coursedb
      - JWT_SECRET=workshop_fake_secret_key
      - PORT=3000
      - NODE_ENV=development
    depends_on:
      monolith-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 3s
      timeout: 1s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  accounts:
    build: services/accounts
    expose:
      - "3000"
    volumes:
      - ./services/accounts/src:/app/src:ro
      - ./services/accounts/tsconfig.json:/app/tsconfig.json:ro
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://courseuser:coursepass@monolith-db:5432/coursedb
      - PORT=3000
      - NODE_ENV=development
    depends_on:
      monolith-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 3s
      timeout: 1s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  monolith:
    build: monolith
    # 📣 Port exposé uniquement en interne, accessible via la gateway
    expose:
      - "3000"
    # 🤓 Volumes pour activer le hot-reload (ignorer)
    volumes:
      - ./monolith/src:/app/src:ro
      - ./monolith/tsconfig.json:/app/tsconfig.json:ro
      # Exclut node_modules pour éviter les conflits
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://courseuser:coursepass@monolith-db:5432/coursedb
      - JWT_SECRET=workshop_fake_secret_key
      - PORT=3000
      - NODE_ENV=development
    depends_on:
      monolith-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 3s
      timeout: 1s
      retries: 3
      start_period: 1s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
  monolith-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=courseuser
      - POSTGRES_PASSWORD=coursepass
      - POSTGRES_DB=coursedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseuser -d coursedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # --- Monitoring end to end
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    depends_on:
      - monolith

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
